<!doctype html>
<html lang="en" class="staticrypt-html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Inken — Portfolio</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/typography.css">
<style>
  .hidden { display: none !important; }
  body { min-height: 100vh; display: grid; place-items: center; background: var(--bg-main); }

  .gate { width: 100%; max-width: 420px; padding: 0 16px; box-sizing: border-box; }
  .gate .t-deco1 { margin: 0 0 24px; }
  .gate .t-title3 { margin: 0 0 8px; }
  .gate .t-body { margin: 0 0 32px; }

  .field { position: relative; }
  .field input {
    width: 100%; box-sizing: border-box; height: 52px; padding: 0 52px 0 16px;
    font: inherit; font-size: var(--text-body-size); letter-spacing: var(--text-body-ls);
    color: var(--color-text); background: var(--color-surface);
    border: 1px solid var(--color-border); border-radius: 8px; outline: none;
  }
  .field input:focus { border-color: var(--color-text); }
  .field input[aria-invalid="true"] { border-color: var(--brand-orange-1); }
  .eye {
    position: absolute; top: 0; right: 0; width: 52px; height: 52px;
    border: 0; background: none; cursor: pointer; color: var(--color-text-muted);
    display: grid; place-items: center;
  }
  .eye:hover { color: var(--color-text); }
  .eye svg { width: 20px; height: 20px; }

  .error { margin: 8px 0 0; color: var(--brand-orange-1); }

  .remember { display: flex; align-items: center; gap: 8px; margin-top: 16px; cursor: pointer; }
  .remember input { width: 16px; height: 16px; margin: 0; accent-color: var(--fg-header); }

  .submit {
    margin-top: 24px; width: 100%; height: 52px; border: 0; border-radius: 8px; cursor: pointer;
    font: inherit; background: var(--fg-header); color: var(--bg-white);
  }
  .submit:hover { background: var(--fg-g1); }
  .submit:focus-visible, .eye:focus-visible { outline: 2px solid var(--brand-yellow-1); outline-offset: 2px; }

  .loading { position: fixed; inset: 0; display: grid; place-items: center; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--bg-enhance); border-top-color: var(--fg-header); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .gate .t-deco1 { font-size: var(--text-deco3-size); line-height: 1; }
  }
</style>
</head>
<body class="staticrypt-body">
  <div id="staticrypt_loading" class="loading"><div class="spinner" aria-label="Loading"></div></div>

  <main id="staticrypt_content" class="gate hidden">
    <h1 class="t-deco1">Inken</h1>
    <p class="t-title3">Portfolio</p>
    <p class="t-body">This portfolio contains confidential work. Enter the password to continue.</p>

    <form id="staticrypt-form" action="#" method="post" novalidate>
      <div class="field">
        <input id="staticrypt-password" type="password" name="password"
               placeholder="Password" aria-label="Password"
               autocomplete="current-password" autofocus>
        <button type="button" class="eye" id="toggle" aria-label="Show password" title="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
            <line id="eye-slash" x1="3" y1="3" x2="21" y2="21"/>
          </svg>
        </button>
      </div>
      <p id="error" class="error t-label2 hidden" role="alert">That password isn't right. Please try again.</p>

      <label id="staticrypt-remember-label" class="remember t-label2 hidden">
        <input id="staticrypt-remember" type="checkbox" name="remember">
        Remember me on this device
      </label>

      <button type="submit" class="submit t-title5">View portfolio</button>
    </form>
  </main>
