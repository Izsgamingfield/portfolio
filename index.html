<!doctype html>
<html lang="en" class="staticrypt-html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="robots" content="noai, noimageai">
<title>Inken — Portfolio</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/typography.css">
<link rel="stylesheet" href="css/buttons.css">
<style>
  /* Layout follows Figma "password" (577:177): an arm reaches down from the top
     of the screen and points at the password field. */
  .hidden { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  body {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg-main);
    overflow-x: hidden;
  }

  /* The password field sits at the vertical centre of the screen (52px tall,
     so the gate starts 26px above the middle); everything else hangs off it. */
  .gate {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -26px);
    width: min(388px, 100vw - 32px);
    padding-bottom: 48px;
  }

  /* Arm: 369×378 drawing above the field; its wrist sits 16px in from the
     field's left edge. The tube's first segment is stretched up to the top
     of the screen in JS. */
  .arm {
    position: absolute;
    left: calc(100% * 16.2 / 388);
    bottom: calc(100% + 14px);
    display: block;
    width: calc(100% * 369.413 / 388);
    height: auto;
    aspect-ratio: 369.413 / 378;
    overflow: visible;
  }

  .field { position: relative; }
  .field input {
    width: 100%; box-sizing: border-box; height: 52px; padding: 0 52px 0 16px;
    font: inherit; font-size: var(--text-body-size); font-weight: var(--weight-regular);
    letter-spacing: var(--text-body-ls); color: var(--fg-header);
    background: var(--bg-white);
    border: 3px solid var(--fg-stroke); border-radius: 16px; outline: none;
  }
  .field input::placeholder { color: var(--fg-body); }
  .field input:focus-visible { box-shadow: 0 0 0 3px var(--brand-yellow-1); }
  .field input[aria-invalid="true"] { border-color: var(--brand-orange-1); }
  .eye {
    position: absolute; top: 0; right: 0; width: 52px; height: 52px;
    border: 0; background: none; cursor: pointer; color: var(--fg-subtitle);
    display: grid; place-items: center;
  }
  .eye:hover { color: var(--fg-header); }
  .eye svg { width: 20px; height: 20px; }
  .eye:focus-visible { outline: 2px solid var(--brand-blue-1); outline-offset: -6px; border-radius: 12px; }

  .error { margin: 8px 0 0; color: var(--brand-orange-1); }
  .error a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }

  .remember { display: flex; align-items: center; gap: 8px; margin-top: 12px; cursor: pointer; }
  .remember input { width: 16px; height: 16px; margin: 0; accent-color: var(--fg-header); }

  .actions { display: flex; justify-content: center; margin-top: 25px; }
  .submit:disabled { opacity: .4; cursor: not-allowed; }

  .loading { position: fixed; inset: 0; display: grid; place-items: center; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--bg-enhance); border-top-color: var(--fg-header); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

</style>
</head>

    <form id="staticrypt-form" action="#" method="post" novalidate>
      <div class="field">
        <input id="staticrypt-password" type="password" name="password"

        <button type="button" class="eye" id="toggle" aria-label="Show password" title="Show password">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.46" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1.667 10s2.916-5.833 8.333-5.833S18.332 10 18.332 10s-2.916 5.833-8.333 5.833S1.667 10 1.667 10Z"/><circle cx="10" cy="10" r="2.5"/>
            <line id="eye-slash" x1="2.5" y1="2.5" x2="17.5" y2="17.5"/>
          </svg>
        </button>
      </div>
      <p id="error" class="error t-label2 hidden" role="alert">That password isn't right. Please try again.</p>
      <p id="insecure" class="error t-label2 hidden" role="alert">This page needs a secure connection to unlock. <a id="secure-link" href="#">Open the secure (https) version</a>.</p>

      </div>
    </form>
